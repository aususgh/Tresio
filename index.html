<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Privada</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=2">
    <meta name="theme-color" content="#1C1C1E">
</head>
<body>

    <!-- ==========================================
         PANTALLA DE INICIO DE SESIÓN
         ========================================== -->
    <div id="login-view" class="view active">
        <div class="login-container">
            <div class="login-header">
                <h2>Bienvenido</h2>
                <p>Inicia sesión para continuar</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Nombre de usuario (Obligatorio)</label>
                    <input type="text" id="username" placeholder="Ej. Augusto" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Correo electrónico (Obligatorio)</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña (Obligatorio)</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>

    <!-- ==========================================
         APLICACIÓN PRINCIPAL
         ========================================== -->
    <div id="main-view" class="view">
        
        <!-- CONTENEDOR DE SECCIONES -->
        <main id="content-area">
            
            <!-- 1. INICIO -->
            <section id="home" class="tab-section active" data-index="0">
                <h1 class="section-title">Inicio</h1>
                <div class="users-grid" id="users-grid">
                    <!-- Los usuarios se cargarán dinámicamente desde Firestore -->
                </div>
            </section>

            <!-- 2. UBICACIÓN -->
            <section id="location" class="tab-section" data-index="1">
                <h1 class="section-title">Ubicación</h1>
                <div style="padding: 0 20px;">
                    <div id="map-wrapper" style="width: 100%; height: 320px; background-color: var(--surface-color); border-radius: 20px; border: 1px solid var(--border-color); overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 15px;">
                        <p id="map-status" style="color: var(--text-muted); padding: 20px; font-size: 14px;">Toca actualizar para ver tu ubicación</p>
                        <iframe id="map-iframe" width="100%" height="100%" frameborder="0" style="border:0; display:none;" allowfullscreen></iframe>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span id="location-time" style="font-size: 12px; color: var(--text-muted); font-weight: 500;">Actualizado: Nunca</span>
                        <button id="btn-update-location" style="background-color: var(--primary-color); color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.2s;">
                            Actualizar ubicación
                        </button>
                    </div>
                </div>
            </section>

            <!-- 3. JUEGOS -->
            <section id="games" class="tab-section" data-index="2">
                <h1 class="section-title">Juegos</h1>
                <div id="games-list" class="games-library">
                    <!-- Los juegos se renderizan aquí -->
                </div>
                <button class="fab" id="btn-add-game">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </section>

            <!-- 4. FRASES -->
            <section id="phrases" class="tab-section" data-index="3">
                <h1 class="section-title">Frases</h1>
                <div id="phrases-list" class="chat-wall">
                    <!-- Las frases se renderizan aquí -->
                </div>
                <div class="chat-input-area">
                    <form id="phrase-form">
                        <input type="text" id="phrase-input" placeholder="Escribe una frase..." autocomplete="off" required>
                        <button type="submit" class="btn-send">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </form>
                </div>
            </section>

            <!-- 5. ENCUESTAS -->
            <section id="polls" class="tab-section" data-index="4">
                <h1 class="section-title">Encuestas</h1>
                <div id="polls-list" class="polls-container">
                    <!-- Las encuestas se renderizan aquí -->
                </div>
                <button class="fab" id="btn-add-poll">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </section>

        </main>

        <!-- BARRA DE NAVEGACIÓN INFERIOR -->
        <nav id="bottom-bar">
            <button class="nav-item active" data-target="home" data-index="0">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Inicio</span>
            </button>
            <button class="nav-item" data-target="location" data-index="1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span>Ubicación</span>
            </button>
            <button class="nav-item" data-target="games" data-index="2">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line></svg>
                <span>Juegos</span>
            </button>
            <button class="nav-item" data-target="phrases" data-index="3">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Frases</span>
            </button>
            <button class="nav-item" data-target="polls" data-index="4">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <span>Encuestas</span>
            </button>
        </nav>
    </div>

    <!-- MODALES -->
    
    <!-- Modal Agregar Juego -->
    <div id="modal-game" class="modal-overlay">
        <div class="modal-content">
            <h3>Agregar Juego</h3>
            <form id="form-add-game">
                <div class="input-group">
                    <label>Nombre del juego</label>
                    <input type="text" id="game-name" required>
                </div>
                <div class="input-group">
                    <label>URL del Icono (Opcional)</label>
                    <input type="url" id="game-icon" placeholder="https://...">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('modal-game')">Cancelar</button>
                    <button type="submit" class="btn-primary">Agregar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Agregar Encuesta -->
    <div id="modal-poll" class="modal-overlay">
        <div class="modal-content">
            <h3>Nueva Encuesta</h3>
            <form id="form-add-poll">
                <div class="input-group">
                    <label>Pregunta</label>
                    <input type="text" id="poll-question" required>
                </div>
                <div class="input-group">
                    <label>Opciones (separadas por coma)</label>
                    <input type="text" id="poll-options" placeholder="Opción 1, Opción 2..." required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="poll-multiselect">
                    <label for="poll-multiselect">Permitir selección múltiple</label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('modal-poll')">Cancelar</button>
                    <button type="submit" class="btn-primary">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Lógica Principal con parámetro para forzar actualización -->
    <script src="app.js?v=2"></script>
</body>
</html>
